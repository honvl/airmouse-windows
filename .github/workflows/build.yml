# Builds AirMouse.exe and the Microsoft Store package (AirMouse.msix) on every push; a v* tag also
# publishes the exe as a GitHub release. The msix goes to Partner Center from the run's artifacts.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: grep -q "Version = \"${GITHUB_REF_NAME#v}\"" src/Program.cs
      - name: Build
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AirMouse
          path: dist/AirMouse.exe
      - uses: actions/upload-artifact@v7
        with:
          name: AirMouse-msix
          path: dist/AirMouse.msix
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/AirMouse.exe --title "AirMouse for Windows ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
